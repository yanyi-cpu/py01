<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>AI 对话系统</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI 对话">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 左栏：会话列表 -->
        <aside class="sidebar-left" id="sidebarLeft">
            <div class="sidebar-header">
                <h2>对话记录</h2>
                <button class="new-chat-btn" id="btnNewChat">+ 新对话</button>
            </div>
            <ul class="game-list" id="gameList"></ul>
        </aside>

        <!-- 中栏：聊天区域 -->
        <main class="chat-area">
            <header class="chat-header">
                <button class="btn-toggle-sidebar" id="btnToggleSidebar" title="侧边栏">&equiv;</button>
                <div class="chat-header-info">
                    <h1 id="chatTitle">AI 对话</h1>
                    <span class="session-label" id="sessionLabel"></span>
                </div>
                <button class="btn-toggle-right" id="btnToggleRight" title="角色设置">角色</button>
            </header>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-char">AI</div>
                    <h2>AI 对话系统</h2>
                    <p>在右侧面板设定角色，然后直接输入消息开始对话</p>
                    <p class="welcome-hint">首次对话后，AI 会自动为会话生成标题</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="messageInput"
                        class="chat-input"
                        placeholder="输入消息…"
                        autocomplete="off"
                    />
                    <button class="send-btn" id="btnSend" title="发送">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- 右栏：角色设定 -->
        <aside class="sidebar-right" id="sidebarRight">
            <h2>角色设定</h2>
            <p class="sidebar-desc">自定义 AI 要扮演的角色。开始对话后修改需确认。</p>

            <div class="form-group">
                <label for="charName">角色名</label>
                <input type="text" id="charName" placeholder="例如：李白、江户川柯南…" />
            </div>

            <div class="form-group">
                <label for="charPersonality">性格特征</label>
                <textarea id="charPersonality" rows="2" placeholder="例如：豪放洒脱、喜欢吟诗…"></textarea>
            </div>

            <div class="form-group">
                <label for="charAppearance">外貌描述</label>
                <textarea id="charAppearance" rows="2" placeholder="例如：身穿白衣、腰间佩剑…"></textarea>
            </div>

            <div class="form-group">
                <label for="charBackground">背景故事</label>
                <textarea id="charBackground" rows="3" placeholder="例如：唐朝著名诗人，被贬后游历天下…"></textarea>
            </div>
        </aside>
    </div>

    <!-- 角色修改确认弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3>修改角色设定</h3>
            <p>当前会话已经开始，修改角色设定后<strong>后续对话</strong>将使用新的角色设定（历史消息不受影响）。确定要修改吗？</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modalCancel">取消</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirm">确定修改</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
</body>
</html>
