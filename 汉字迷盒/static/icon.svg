<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 对话气泡 -->
  <rect x="100" y="140" width="312" height="210" rx="40" fill="rgba(255,255,255,0.95)"/>
  <!-- 气泡三角 -->
  <polygon points="350,350 370,420 290,350" fill="rgba(255,255,255,0.95)"/>
  <!-- 三条横线（文字示意） -->
  <rect x="140" y="185" width="160" height="18" rx="9" fill="#c7d2fe"/>
  <rect x="140" y="225" width="230" height="18" rx="9" fill="#c7d2fe"/>
  <rect x="140" y="265" width="120" height="18" rx="9" fill="#c7d2fe"/>
  <!-- AI 星标 -->
  <circle cx="380" cy="190" r="40" fill="#f59e0b"/>
  <text x="380" y="202" text-anchor="middle" font-size="44" font-family="sans-serif" font-weight="bold" fill="white">AI</text>
</svg>
